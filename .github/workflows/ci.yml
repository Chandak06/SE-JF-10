name: Integrated application CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sprint-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:ci
      - name: Frontend tests and build when integrated
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: |
          npm ci
          npm run test:ci
          npm run lint
          npm run build
      - name: Build and verify local Node release without Docker or Atlas
        run: |
          npm run demo:build
          npm run demo:verify
      - name: Retain test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integrated-test-reports
          path: |
            reports/
            coverage/
            frontend/reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain frontend build
        uses: actions/upload-artifact@v7
        with:
          name: integrated-frontend
          path: frontend/dist/
          if-no-files-found: error
      - name: Retain backend build
        uses: actions/upload-artifact@v7
        with:
          name: integrated-backend
          path: dist/
          if-no-files-found: error
  browsers:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, firefox]
    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chrome msedge firefox
        working-directory: frontend
      - run: npm run test:browser -- --project=${{ matrix.browser }}
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence-${{ matrix.browser }}
          path: |
            frontend/playwright-report/
            frontend/reports/browser-junit.xml
            frontend/test-results/
          retention-days: 14
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: docker build -f deploy/backend.Dockerfile -t se-jackfruit-backend .
      - run: docker build -f deploy/web.Dockerfile -t se-jackfruit-web .
      - name: Validate HTTPS gateway configuration
        run: docker run --rm -e SITE_ADDRESS=example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Start disposable local release
        run: docker compose -p sprint2-ci -f compose.local.yaml up --build -d
      - name: Verify built frontend and backend through gateway
        env:
          RELEASE_SMOKE_CONFIRM: disposable-local
        run: node scripts/check-local-release.mjs
      - name: Diagnose disposable CI startup failure
        if: failure()
        run: docker compose -p sprint2-ci -f compose.local.yaml logs --no-color --tail=100 mongo backend web
      - name: Clean disposable CI deployment
        if: always()
        run: docker compose -p sprint2-ci -f compose.local.yaml down -v
