# Explicit loopback HTTPS deployment with its own persistent local database and CA.
services:
  mongo:
    image: mongo:8
    volumes:
      - local-https-database:/data/db
    networks:
      application:
        ipv4_address: 172.30.0.4
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 30
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/study_commons_local_https
      CLIENT_ORIGIN: https://localhost:8443
      TRUST_PROXY: 172.30.0.2/32
      BCRYPT_ROUNDS: '12'
    networks:
      application:
        ipv4_address: 172.30.0.3
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - '127.0.0.1:8443:8443'
    volumes:
      - ./deploy/Caddy.https.localfile:/etc/caddy/Caddyfile:ro
      - local-https-certificates:/data
    networks:
      application:
        ipv4_address: 172.30.0.2
    depends_on:
      backend:
        condition: service_healthy
  seed-admin:
    profiles: [setup]
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
      target: build
    user: node
    command: [npm, run, 'seed:admin']
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/study_commons_local_https
      ADMIN_PROVISION_CONFIRM: ${ADMIN_PROVISION_CONFIRM:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    networks:
      - application
    depends_on:
      mongo:
        condition: service_healthy
networks:
  application:
    ipam:
      config:
        - subnet: 172.30.0.0/24
volumes:
  local-https-database:
  local-https-certificates:
