services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      NODE_ENV: production
      PORT: '5000'
      MONGODB_URI: ${MONGODB_URI:?Configure a MongoDB URI outside source control}
      CLIENT_ORIGIN: https://${SITE_ADDRESS:?Configure the public DNS hostname}
      TRUST_PROXY: 172.31.0.2/32
      BCRYPT_ROUNDS: '12'
      MAX_UPLOAD_BYTES: '10485760'
    restart: unless-stopped
    networks:
      application:
        ipv4_address: 172.31.0.3
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Configure the public DNS hostname}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      application:
        ipv4_address: 172.31.0.2
networks:
  application:
    ipam:
      config:
        - subnet: 172.31.0.0/24
volumes:
  caddy-data:
  caddy-config:
